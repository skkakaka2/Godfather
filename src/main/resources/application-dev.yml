spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_hub?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:admin}
      database: 0
      timeout: 5000ms

logging:
  level:
    com.family.hub: debug
    org.springframework.security: debug
