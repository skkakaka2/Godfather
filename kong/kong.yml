_format_version: "2.1"
services:
  - name: godfather-api
    host: godfather-api-upstream
    port: 8081
    protocol: http
    routes:
      - name: api-route
        paths:
          - /
upstreams:
  - name: godfather-api-upstream
    targets:
      - target: godfather-backend-1:8081
        weight: 50
      - target: godfather-backend-2:8081
        weight: 50
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
          max_age: 3600
