_format_version: "2.1"
services:
  - name: godfather-api
    url: http://godfather-backend-1:8081
    routes:
      - name: api-route
        paths:
          - /
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
          max_age: 3600
